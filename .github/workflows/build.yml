name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq soft-cosmetics.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.8.2 }
      - run: gradle build --no-daemon
        working-directory: soft-cosmetics
      - uses: actions/upload-artifact@v4
        with:
          name: soft-cosmetics
          path: soft-cosmetics/build/libs/soft-cosmetics-*.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Soft Cosmetics build ${{ github.run_number }}
          files: soft-cosmetics/build/libs/soft-cosmetics-1.0.0.jar
